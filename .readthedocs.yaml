# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # RTD defaults to a depth of 50 but qbittorrent-api versioning may require
      # much more Git history to accurately determine the SCM version
      - git fetch --unshallow
    create_environment:
      # install the uv version pinned in uv.lock and create the environment RTD builds the docs in
      - asdf plugin add uv
      # RTD re-splits commands and mangles quoting, so this avoids quotes and escapes
      - asdf install uv $(grep -A1 -x name.=..uv. uv.lock | grep -o [0-9][0-9.]*)
      - asdf global uv $(grep -A1 -x name.=..uv. uv.lock | grep -o [0-9][0-9.]*)
      - uv venv --python "3.14" "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --group docs --group dev
    pre_build:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run tox -e docs-lint

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf

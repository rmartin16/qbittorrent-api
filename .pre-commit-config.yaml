repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-case-conflict
      - id: check-docstring-first
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # need a post v1.7.5 release for latest pre-commit
  #- repo: https://github.com/PyCQA/docformatter
  #  rev: v1.7.5
  #  hooks:
  #    - id: docformatter
  #      exclude: _attrdict.py
  #      args:
  #        - --in-place
  #        - --pre-summary-newline
  #        - --black
  #        - --non-cap=qBittorrent

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff
        args:
          - --fix
          - --unsafe-fixes
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - types-requests==2.33.0.20261006
          - packaging==26.3
        args:
          - --strict
          - --disallow-any-unimported
#          - --disallow-any-expr
#          - --disallow-any-decorated
          - --strict-optional
          - --show-traceback
          - --implicit-reexport
